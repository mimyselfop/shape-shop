<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: '4:00 PM|2', kids: 1, visits: 3, friends: 2, dash: 0 };
  }
  renderVals() {
    const D = {
      morning: { name: 'Morning Workout', len: '55 min', desc: 'Wake up, get out of bed and jumpstart your day with total-body cardio and muscle work.' },
      yah: { name: 'Young @ Heart', len: '45 min', desc: 'A low-impact aerobic floor workout with strength training and flexibility.' },
      cardio: { name: 'Cardio Strength', len: '55 min', desc: 'Tone head to toe with body weight and added weight. Sweaty yet satisfied.' },
      strength: { name: 'Strength', len: '55 min', desc: 'Work every major muscle group to build muscle and bone density.' },
      stab: { name: 'Strength & Stability', len: '55 min', desc: 'Strength work with a focus on control and stability.' },
      silver: { name: 'SilverSneakers', len: '45 min', desc: 'Move to the music with weights, tubing and a ball. A chair is there for support.' },
      dance: { name: 'Stretch & Pure Dance', len: '45 min', desc: 'Dance-based cardio from pop to country, jazz to Latin. Group led.' },
      step: { name: 'Step Workout', len: '55 min', desc: 'Cardio combos on an adjustable platform, plus strength, abs and stretching.' },
      hiit: { name: 'HIIT', len: '55 min', desc: 'High-intensity bursts with active recovery, plus toning, abs and stretching.' },
      tbc: { name: 'Total Body Conditioning', len: '55 min', desc: 'Plyometrics, free weights and cardio. It will push you, with modifications for all levels.' },
      stations: { name: 'Stations', len: '[LENGTH]', desc: '[DESCRIPTION: circuit-style stations class]' },
      sbs: { name: 'Strength, Balance & Stretch', len: '55 min', desc: 'Body weight, balance and hip mobility, ending with stretch and relaxation.' }
    };
    const times = ['5:30 AM', '8:00 AM', '9:00 AM', '9:30 AM', '10:15 AM', '10:30 AM', '4:00 PM'];
    const dayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    const S = {
      '5:30 AM': [['morning', 'Crystal'], null, ['morning', 'Crystal'], ['morning', 'Crystal'], null],
      '8:00 AM': [['yah', 'Kristy'], null, ['yah', 'Crystal'], null, ['yah', 'Kristy']],
      '9:00 AM': [['cardio', 'Anna'], null, ['strength', 'Anna'], null, ['sbs', 'Anna']],
      '9:30 AM': [null, ['silver', 'Kristy'], null, ['silver', 'Crystal'], null],
      '10:15 AM': [['stab', 'Crystal'], null, null, null, null],
      '10:30 AM': [null, ['dance', 'Group led'], null, ['dance', 'Group led'], null],
      '4:00 PM': [['step', 'Christy'], ['hiit', 'Christy'], ['tbc', 'Christy'], ['stations', 'Christy'], null]
    };
    const st = this.state;
    const parts = st.pick.split('|');
    const pc = S[parts[0]][Number(parts[1])];
    const picked = Object.assign({ who: pc[1] }, D[pc[0]]);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const perChild = Math.min(st.visits * 2, 6);
    const capped = st.visits * 2 > 6;
    const dashPics = [
      { src: 'images/dash2.jpg', alt: 'A team in matching lime shirts holding yellow and blue balloons before the race', cap: 'Team spirit in yellow and blue', pos: '50% 45%', fit: 'cover' },
      { src: 'images/dash7.jpg', alt: 'A big crowd of runners and walkers gathered at the start', cap: 'Neighbors packing the start line', pos: '50% 60%', fit: 'cover' },
      { src: 'images/dash4.jpg', alt: 'A trailer decorated with a Why We Dash banner and photos', cap: 'Why we dash', pos: '50% 55%', fit: 'cover' },
      { src: 'images/dash5.jpg', alt: 'Participants lined up together on the course', cap: 'Lined up and ready to go', pos: '50% 50%', fit: 'cover' },
      { src: 'images/dash1.jpg', alt: 'A runner wearing bib 223 receiving a medal at the finish', cap: 'Medal moments at the finish', pos: '50% 35%', fit: 'cover' },
      { src: 'images/dash3.jpg', alt: 'A group of finishers posing with their medals', cap: 'Finishers, medals and big smiles', pos: '50% 55%', fit: 'cover' },
      { src: 'images/dash6.jpg', alt: 'An officer handing yellow and blue balloons to a young girl', cap: 'Balloons for the littlest dashers', pos: '50% 50%', fit: 'cover' },
      { src: 'images/dash8.jpg', alt: 'A smiling woman in a race shirt holding a little girl', cap: 'A family day, every year', pos: '50% 30%', fit: 'contain' },
      { src: 'images/dash9.jpg', alt: 'Kids riding in a utility vehicle at the race, one wearing bib 301', cap: 'Riding in style', pos: '50% 55%', fit: 'cover' }
    ];
    const dn = dashPics.length;
    const dsel = st.dash;
    return {
      dcur: dashPics[dsel],
      dnum: dsel + 1,
      dtotal: dn,
      dPrev: () => this.setState({ dash: (dsel + dn - 1) % dn }),
      dNext: () => this.setState({ dash: (dsel + 1) % dn }),
      dashThumbs: dashPics.map((p, i) => ({
        src: p.src,
        label: 'Show photo ' + (i + 1) + ': ' + p.cap,
        pressed: i === dsel ? 'true' : 'false',
        ring: i === dsel ? 'outline: 3px solid #C6FF3D; outline-offset: 2px; opacity: 1;' : 'outline: 1px solid #1E3160; opacity: 0.55;',
        pick: () => this.setState({ dash: i })
      })),
      grid: times.map((t) => ({
        time: t,
        cells: S[t].map((c, i) => {
          const key = t + '|' + i;
          const sel = st.pick === key;
          return c ? {
            has: true, none: false, name: D[c[0]].name, who: c[1],
            pressed: sel ? 'true' : 'false',
            style: sel ? 'background: #C6FF3D; color: #050B1C; border: 1.5px solid #C6FF3D; box-shadow: 0 0 22px rgba(198,255,61,0.45);' : 'background: #0F1E40; color: #FFFFFF; border: 1px solid #1E3160;',
            pick: () => this.setState({ pick: key })
          } : { has: false, none: true };
        })
      })),
      picked: picked,
      pickedWhen: (dayNames[Number(parts[1])] + ' · ' + parts[0]).toUpperCase(),
      kids: st.kids,
      visits: st.visits,
      friends: st.friends,
      weekly: st.kids * perChild,
      capNote: capped ? 'The $6 weekly cap kicked in. Come every day!' : 'Per child: $' + perChild + ' this week',
      reward: st.friends * 25,
      rewardNote: st.friends === 0 ? 'Go on, you know somebody.' : (st.friends === 1 ? 'in gift cards for one workout buddy' : 'in gift cards for ' + st.friends + ' workout buddies'),
      kidsDown: () => this.setState({ kids: clamp(st.kids - 1, 1, 6) }),
      kidsUp: () => this.setState({ kids: clamp(st.kids + 1, 1, 6) }),
      daysDown: () => this.setState({ visits: clamp(st.visits - 1, 1, 5) }),
      daysUp: () => this.setState({ visits: clamp(st.visits + 1, 1, 5) }),
      friendsDown: () => this.setState({ friends: clamp(st.friends - 1, 0, 20) }),
      friendsUp: () => this.setState({ friends: clamp(st.friends + 1, 0, 20) })
    };
  }
}
window.__dcMount(Component);
</script>
