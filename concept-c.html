      yah: { name: 'Young @ Heart', len: '45 min', level: 'gentle', desc: 'Low-impact aerobics with strength and flexibility.' },
      cardio: { name: 'Cardio Strength', len: '55 min', level: 'steady', desc: 'Head-to-toe toning with body weight and added weight.' },
      strength: { name: 'Strength', len: '55 min', level: 'steady', desc: 'Work every major muscle group and build bone density.' },
      stab: { name: 'Strength & Stability', len: '55 min', level: 'steady', desc: 'Strength work with control and stability.' },
      silver: { name: 'SilverSneakers Classic', len: '45 min', level: 'gentle', desc: 'Weights, tubing and a ball. A chair is there if you need it.' },
      dance: { name: 'Stretch & Pure Dance', len: '45 min', level: 'gentle', desc: 'Pop, country, jazz and Latin. Two left feet welcome.' },
      step: { name: 'Step Workout', len: '55 min', level: 'allout', desc: 'Cardio combos on a platform you adjust to your level.' },
      hiit: { name: 'HIIT', len: '55 min', level: 'allout', desc: 'High-intensity bursts, active recovery, abs and stretch.' },
      tbc: { name: 'Total Body Conditioning', len: '55 min', level: 'allout', desc: 'Plyos, free weights and cardio. It will push you.' },
      stations: { name: 'Stations', len: '[LENGTH]', level: 'steady', desc: '[DESCRIPTION: circuit-style stations class]' },
      sbs: { name: 'Strength, Balance & Stretch', len: '55 min', level: 'gentle', desc: 'Balance, hip mobility, and a relaxing stretch to end the week.' }
    };
    const LV = { gentle: 'GENTLE', steady: 'STEADY', allout: 'ALL-OUT' };
    const s = (time, key, who) => Object.assign({ time: time, who: who }, D[key], { levelLabel: LV[D[key].level] });
    const sched = {
      mon: [s('5:30 AM', 'morning', 'Crystal'), s('8:00 AM', 'yah', 'Kristy'), s('9:00 AM', 'cardio', 'Anna'), s('10:15 AM', 'stab', 'Crystal'), s('4:00 PM', 'step', 'Christy')],
      tue: [s('9:30 AM', 'silver', 'Kristy'), s('10:30 AM', 'dance', 'Group led'), s('4:00 PM', 'hiit', 'Christy')],
      wed: [s('5:30 AM', 'morning', 'Crystal'), s('8:00 AM', 'yah', 'Crystal'), s('9:00 AM', 'strength', 'Anna'), s('4:00 PM', 'tbc', 'Christy')],
      thu: [s('5:30 AM', 'morning', 'Crystal'), s('9:30 AM', 'silver', 'Crystal'), s('10:30 AM', 'dance', 'Group led'), s('4:00 PM', 'stations', 'Christy')],
      fri: [s('8:00 AM', 'yah', 'Kristy'), s('9:00 AM', 'sbs', 'Anna')]
    };
    const st = this.state;
    const dayNames = [['mon', 'MON'], ['tue', 'TUE'], ['wed', 'WED'], ['thu', 'THU'], ['fri', 'FRI']];
    const levelNames = [['all', 'Any pace'], ['gentle', 'Gentle'], ['steady', 'Steady'], ['allout', 'All-out']];
    const list = sched[st.day].filter((c) => st.level === 'all' ? true : c.level === st.level);
    const person = (id) => ({
      open: st.open === id,
      expanded: st.open === id ? 'true' : 'false',
      btn: st.open === id ? 'Close' : 'What they teach',
      toggle: () => this.setState({ open: st.open === id ? '' : id })
    });
    const dashPics = [
      { src: 'images/dash2.jpg', alt: 'A team in matching lime shirts holding yellow and blue balloons before the race', cap: 'Team spirit in yellow and blue', pos: '50% 45%', fit: 'cover' },
      { src: 'images/dash7.jpg', alt: 'A big crowd of runners and walkers gathered at the start', cap: 'Neighbors packing the start line', pos: '50% 60%', fit: 'cover' },
      { src: 'images/dash4.jpg', alt: 'A trailer decorated with a Why We Dash banner and photos', cap: 'Why we dash', pos: '50% 55%', fit: 'cover' },
      { src: 'images/dash5.jpg', alt: 'Participants lined up together on the course', cap: 'Lined up and ready to go', pos: '50% 50%', fit: 'cover' },
      { src: 'images/dash1.jpg', alt: 'A runner wearing bib 223 receiving a medal at the finish', cap: 'Medal moments at the finish', pos: '50% 35%', fit: 'cover' },
      { src: 'images/dash3.jpg', alt: 'A group of finishers posing with their medals', cap: 'Finishers, medals and big smiles', pos: '50% 55%', fit: 'cover' },
      { src: 'images/dash6.jpg', alt: 'An officer handing yellow and blue balloons to a young girl', cap: 'Balloons for the littlest dashers', pos: '50% 50%', fit: 'cover' },
      { src: 'images/dash8.jpg', alt: 'A smiling woman in a race shirt holding a little girl', cap: 'A family day, every year', pos: '50% 30%', fit: 'contain' },
      { src: 'images/dash9.jpg', alt: 'Kids riding in a utility vehicle at the race, one wearing bib 301', cap: 'Riding in style', pos: '50% 55%', fit: 'cover' }
    ];
    const dn = dashPics.length;
    const dsel = st.dash;
    return {
      dcur: dashPics[dsel],
      dnum: dsel + 1,
      dtotal: dn,
      dPrev: () => this.setState({ dash: (dsel + dn - 1) % dn }),
      dNext: () => this.setState({ dash: (dsel + 1) % dn }),
      dashThumbs: dashPics.map((p, i) => ({
        src: p.src,
        label: 'Show photo ' + (i + 1) + ': ' + p.cap,
        pressed: i === dsel ? 'true' : 'false',
        ring: i === dsel ? 'outline: 3px solid #2CF5FF; outline-offset: 2px; opacity: 1;' : 'outline: 1px solid #1E3160; opacity: 0.6;',
        pick: () => this.setState({ dash: i })
      })),
      days: dayNames.map((n) => ({
        label: n[1],
        pressed: st.day === n[0] ? 'true' : 'false',
        style: st.day === n[0] ? 'background: linear-gradient(90deg, #3B6BFF 0%, #2CF5FF 100%); color: #060D1F;' : 'background: transparent; color: #C9D6F2;',
        pick: () => this.setState({ day: n[0] })
      })),
      levels: levelNames.map((n) => ({
        label: n[1],
        pressed: st.level === n[0] ? 'true' : 'false',
        style: st.level === n[0] ? 'background: #2CF5FF; color: #060D1F;' : 'background: transparent; color: #2CF5FF;',
        pick: () => this.setState({ level: n[0] })
      })),
      classes: list,
      empty: list.length === 0,
      kristy: person('kristy'),
      crystal: person('crystal'),
      anna: person('anna'),
      christy: person('christy')
    };
  }
}
window.__dcMount(Component);
</script>
